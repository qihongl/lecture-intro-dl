ines": [], "minutes": 6, "notes": "Use Transformer Explainer as the main live class demo: https://poloclub.github.io/transformer-explainer/ . The preview is an unaltered screenshot of its preset example captured on October 14, 2026, while the local GPT-2 download was pending; it is not a claim that custom inference was tested. Open the site ahead of class and allow its model download to finish. Start from its preset sentence, inspect one query row and change the selected head; then connect attention output to the token-wise MLP and next-token probabilities. GPT-2 small is a causal decoder-only model. Use the 3Blue1Brown video, Attention in transformers, step-by-step (Deep Learning Chapter 6), https://www.youtube.com/watch?v=eMlx5fFNoYc , for the geometric intuition. Optional BertViz, https://github.com/jessevig/bertviz , allows attention-head inspection. Its BERT examples match the bidirectional attention walkthrough. The featured Transformer Explainer instead uses GPT-2, which accesses current and earlier words when predicting the next token. State this difference briefly before opening that tool. Bidirectional attention is one configuration of the shared mechanism, not a property of every transformer. BertViz: Vig (2019), https://aclanthology.org/P19-3007/ . Attention weights alone do not establish a causal account of the model prediction. All three links are clickable in the HTML and printable PDF. Six minutes are reserved for the live demonstration within the 90-minute lecture. Screenshot courtesy of the Georgia Tech Polo Club Transformer Explainer team; the tool is linked directly rather than embedded so the slide does not depend on a network connection to load.", "q": "", "a": "", "controls": "", "source": "Transformer Explainer · Georgia Tech Polo Club", "figure": "transformer-explainer", "cfg": {"visualSteps": 0, "resources": [{"label": "Transformer Explainer", "caption": "GPT-2 · current and earlier words", "url": "https://poloclub.github.io/transformer-explainer/"}, {"label": "3Blue1Brown", "caption": "Attention, step by step · video", "url": "https://www.youtube.com/watch?v=eMlx5fFNoYc"}, {"label": "BertViz", "caption": "BERT examples · both directions", "url": "https://github.com/jessevig/bertviz"}]}, "appendix": false, "index": 43, "id": "slide-44", "start": 76.0, "end": 82.0, "part": "Transformers & attention", "line_steps": [], "content_steps": 0, "steps": 0, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Unaltered Transformer Explainer preset screenshot, captured October 14, 2026; custom inference was still downloading. Links open the live tools."}, {"title": "Compare language models with brain responses", "kind": "readout", "lines": ["Present the same language to model and participants.", "Fit a readout from representations to predicted responses.", "Compare predictions with recordings for held-out stimuli."], "minutes": 1.5, "notes": "Schrimpf et al. benchmarked43 language models against two fMRI datasets and one ECoG dataset; also reading times. Sentence/word aggregation and fitting differ by dataset. This diagram teaches the shared comparison logic, not a claim all stimuli were identical across studies. Neural readout fitting is distinct from language-model pretraining. The anatomical human-brain image is a generic symbol for the neural-recording branch, not measured activation data or a localization map. Image: NIAID Visual & Medical Arts, Ryan Kissinger (2024), Brain Lateral, NIH BioArt BIOART-000060, public domain, courtesy of NIAID; https://bioart.niaid.nih.gov/bioart/60. Use separate model and participant branches. Compare is where predicted responses meet recorded responses. The model does not produce or cause the participant recording. Fit the readout on training stimuli and evaluate it on held-out stimuli.", "q": "", "a": "", "controls": "", "source": "Schrimpf et al. (2021) · PNAS · doi:10.1073/pnas.2105646118", "figure": "", "cfg": {"domain": "language", "lineSteps": [1, 3, 4], "visualSteps": 4}, "appendix": false, "index": 44, "id": "slide-45", "start": 82.0, "end": 83.5, "part": "Transformers & attention", "line_steps": [1, 3, 4], "content_steps": 4, "steps": 4, "cue": ["Introduce the visible input or diagram.", "Reveal: Present the same language to model and participants.", "Reveal: Fit a readout from representations to predicted responses.", "Reveal: Compare predictions with recordings for held-out stimuli."], "references": [["Schrimpf et al. (2021) · Language and brain", "https://doi.org/10.1073/pnas.2105646118"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Next-word performance and brain predictivity", "kind": "figure", "lines": ["Perplexity scores next-word prediction: lower is better. It decreases from left to right.", "Higher on the vertical axis means better predictions of recorded brain responses.", "Each point represents a model."], "minutes": 2.5, "notes": "Published Figure3A, article p.5. The x-axis decreases left→right; make this explicit before discussing trend. y is normalized neural predictivity aggregated across three datasets. r=0.44 in the plotted aggregate. The inset separates datasets: ECoG association positive but not significant. Preserve all points and inset. The paper identifies error bars as median absolute deviation over subject scores (Fig.2 caption: here and elsewhere), not95% CIs; do not relabel them. Normalization by a noise ceiling does not mean all raw neural variance is explained. Explain perplexity as the model’s average uncertainty about the next word: a lower score means it assigns more probability to the words that actually follow. It is not classification accuracy. The plotted neural scores are normalized relative to an estimated noise ceiling and aggregated across datasets; keep that technical detail in narration rather than adding another visual definition.", "q": "", "a": "", "controls": "", "source": "Schrimpf et al. (2021) · PNAS · doi:10.1073/pnas.2105646118", "figure": "schrimpf", "cfg": {"enlarged": true}, "appendix": false, "index": 45, "id": "slide-46", "start": 83.5, "end": 86.0, "part": "Transformers & attention", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Perplexity scores next-word prediction: lower is better. It decreases from left to right.", "Reveal: Higher on the vertical axis means better predictions of recorded brain responses.", "Reveal: Each point represents a model."], "references": [["Schrimpf et al. (2021) · Language and brain", "https://doi.org/10.1073/pnas.2105646118"]], "visual_note": "Original published figure; axes, colors, labels and uncertainty retain the source meaning."}, {"title": "A predictive model is a testable hypothesis", "kind": "claim", "lines": ["Better next-word prediction was associated with better neural fits.", "Architecture and training both mattered.", "A good fit does not prove the brain implements GPT."], "minutes": 1, "notes": "Some untrained models also had substantial neural predictivity after fitting a readout. This limits a training-only explanation. Treat the work as evidence about candidate representational computations, not direct identification of the brain algorithm or a claim of biological self-attention.", "q": "", "a": "", "controls": "", "source": "Schrimpf et al. (2021) · PNAS · doi:10.1073/pnas.2105646118", "figure": "", "cfg": {"textOnly": true, "lineSteps": [1, 2, 3], "visualSteps": 0}, "appendix": false, "index": 46, "id": "slide-47", "start": 86.0, "end": 87.0, "part": "Transformers & attention", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Better next-word prediction was associated with better neural fits.", "Reveal: Architecture and training both mattered.", "Reveal: A good fit does not prove the brain implements GPT."], "references": [["Schrimpf et al. (2021) · Language and brain", "https://doi.org/10.1073/pnas.2105646118"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Choose the information flow", "kind": "compare", "lines": ["MLP: combine input features.", "RNN / LSTM / GRU: update a state through time.", "CNN: reuse local filters across space.", "Transformer: mix available context with attention."], "minutes": 1, "notes": "Build the comparison rows. Architecture is often combined in practice; the rows describe characteristic operations, not exclusive application domains. Every family learns parameters and needs generalization checks. Ask students to describe the information each operation makes available.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"rowCenters": [75, 220, 365, 510]}, "appendix": false, "index": 47, "id": "slide-48", "start": 87.0, "end": 88.0, "part": "Consolidation", "line_steps": [1, 2, 3, 4], "content_steps": 4, "steps": 4, "cue": ["Introduce the visible input or diagram.", "Reveal: MLP: combine input features.", "Reveal: RNN / LSTM / GRU: update a state through time.", "Reveal: CNN: reuse local filters across space.", "Reveal: Transformer: mix available context with attention."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Deep learning architectures as model organisms", "kind": "model-organism", "lines": [], "minutes": 2, "notes": "Close the lecture with the two-way exchange between AI and neuroscience. The minute freed by removing the separate closing-question slide is reserved for explaining this figure. Start with an explicit multilayer neural network and the anatomical human brain. Build 1 reveals the blue network-to-brain arrow: Test brain hypotheses. Deep learning architectures are tractable computational test beds: vary architecture, learning objectives or experience; inspect internal representations; perturb units or connections; compare behavioral and neural predictions with independent biological evidence. The phrase model organism is an analogy to experimental systems, not a claim that an artificial network is a biological organism or an exact copy of the brain. Build 2 adds the orange brain-to-network arrow: Inspire better AI. Computational principles learned from neuroscience can suggest architectures, learning rules and memory mechanisms; whether these improve AI must be tested. The two directions describe scientific exchange, not physical causation between the depicted objects. The network drawing is schematic, not a trained model or measured activity. Keep the on-slide wording to the title, two object labels and two arrow captions; narrate the details. References: Richards et al. (2019), A deep learning framework for neuroscience, Nature Neuroscience 22:1761–1770, https://doi.org/10.1038/s41593-019-0520-2 ; Hassabis, Kumaran, Summerfield & Botvinick (2017), Neuroscience-Inspired Artificial Intelligence, Neuron 95:245–258, https://doi.org/10.1016/j.neuron.2017.06.011 . Brain image: NIAID Visual & Medical Arts, Ryan Kissinger (2024), Brain Lateral, NIH BioArt BIOART-000060, public domain, courtesy of NIAID; https://bioart.niaid.nih.gov/bioart/60.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"fullWidth": true, "visualSteps": 2, "assets": ["human-brain"]}, "appendix": false, "index": 48, "id": "slide-49", "start": 88.0, "end": 90.0, "part": "Consolidation", "line_steps": [], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "References", "kind": "references", "lines": [], "minutes": 0, "notes": "Full primary-source links and figure provenance are provided here and in the instructor notes. The author manuscript for Semantic Cognition predates the2004 book edition. Architecture dates identify seminal sources rather than all modern implementations.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {}, "appendix": true, "index": 49, "id": "slide-50", "start": 90.0, "end": 90.0, "part": "Optional reference", "line_steps": [], "content_steps": 0, "steps": 0, "cue": ["Introduce the visible input or diagram."], "references": [["Christopher Olah (2015) · Understanding LSTM Networks", "https://colah.github.io/posts/2015-08-Understanding-LSTMs/"], ["Rogers & McClelland (2004) · Semantic Cognition", "https://web.stanford.edu/~jlmcc/papers/RogersMcCBook_7_03.pdf"], ["Saffran, Aslin & Newport (1996) · Statistical learning in infants", "https://pubmed.ncbi.nlm.nih.gov/8943209/"], ["Elman (1990) · Finding Structure in Time", "https://jeffelman.ucsd.edu/research/publications/"], ["Howard & Kahana (2002) · Temporal Context Model", "https://memory.psych.upenn.edu/files/pubs/HowaKaha02.pdf"], ["Hochreiter & Schmidhuber (1997) · LSTM", "https://www.bioinf.jku.at/publications/older/2604.pdf"], ["Gers, Schmidhuber & Cummins (2000) · Learning to Forget", "https://doi.org/10.1162/089976600300015015"], ["Cho et al. (2014) · RNN Encoder–Decoder / GRU", "https://aclanthology.org/D14-1179/"], ["Yamins et al. (2014) · Visual cortex", "https://doi.org/10.1073/pnas.1403112111"], ["Vaswani et al. (2017) · Attention Is All You Need", "https://arxiv.org/abs/1706.03762"], ["Radford et al. (2019) · GPT-2", "https://cdn.openai.com/better-language-models/language-models.pdf"], ["Schrimpf et al. (2021) · Language and brain", "https://doi.org/10.1073/pnas.2105646118"], ["Devlin et al. (2019) · BERT", "https://aclanthology.org/N19-1423/"], ["Tulving (1972/1987) · Episodic and semantic memory", "https://garfield.library.upenn.edu/classics1987/A1987K743800001.pdf"], ["Mandler & McDonough (1993) · Concept Formation in Infancy", "https://doi.org/10.1016/S0885-2014(93)80003-C"], ["Rogers et al. (2004) · Semantic dementia", "https://web.stanford.edu/~jlmcc/papers/RogersETAL04.pdf"], ["Saxe, McClelland & Ganguli (2019) · Semantic development", "https://doi.org/10.1073/pnas.1820226116"], ["Anderson (2026) · Beni greenlet news report", "https://www.sci.news/biology/beni-greenlet-hylophilus-moxensis-14464.html"], ["Krizhevsky, Sutskever & Hinton (2012) · AlexNet", "https://www.cs.toronto.edu/~hinton/absps/imagenet.pdf"], ["Richards et al. (2019) · Deep learning for neuroscience", "https://doi.org/10.1038/s41593-019-0520-2"], ["Hassabis et al. (2017) · Neuroscience-inspired AI", "https://doi.org/10.1016/j.neuron.2017.06.011"], ["NIAID Visual & Medical Arts (2024) · Human brain illustration · Courtesy of NIAID", "https://bioart.niaid.nih.gov/bioart/60"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}];let index=0,build=0;const select=document.getElementById('select');NOTES.forEach((s,i)=>select.add(new Option(`${i+1}. ${s.title}`,i)));const time=t=>`${Math.floor(t).toString().padStart(2,'0')}:${Math.round((t%1)*60).toString().padStart(2,'0')}`;function show(i,b=0){index=Math.max(0,Math.min(NOTES.length-1,i));build=b;const s=NOTES[index];select.value=index;document.getElementById('step').textContent=`Build ${b} / ${s.steps}`;document.getElementById('content').innerHTML=`<h1>${index+1}. ${s.title}</h1><p class="time">${s.part} · planned ${time(s.start)}–${time(s.end)} · ${s.minutes} min</p><p>${s.notes}</p>${s.q?`<div class="question"><h2>Student question</h2><p>${s.q}</p><p class="answer">${s.a}</p></div>`:''}${s.cue.length?`<h2>Build cues</h2><ol>${s.cue.map(c=>`<li>${c}</li>`).join('')}</ol>`:''}<h2>Visual interpretation</h2><p class="small">${s.visual_note||'Text and equation explanation.'}</p><h2>Further reading</h2><p class="small">${s.references.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join('<br>')}</p>`;}function command(action,value){if(window.opener&&!window.opener.closed)window.opener.postMessage({type:'dl-command',action,value},'*');else if(action==='jump')show(+value);else show(index+(action==='next'?1:-1))}select.onchange=()=>command('jump',+select.value);document.getElementById('back').onclick=()=>command('previous');document.getElementById('next').onclick=()=>command('next');window.addEventListener('message',e=>{if(e.source===window.opener&&e.data?.type==='dl-notes')show(e.data.index,e.data.step)});document.addEventListener('keydown',e=>{if(e.target.closest('select,input,button'))return;if(['ArrowRight',' '].includes(e.key)){e.preventDefault();command('next')}if(e.key==='ArrowLeft'){e.preventDefault();command('previous')}});show(0);window.opener?.postMessage({type:'dl-ready'},'*');</script></body></html>
