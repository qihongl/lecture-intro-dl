</style></head><body><div class="bar"><button id="back">Back</button><button id="next">Next</button><select id="select" aria-label="Choose slide"></select><span class="step" id="step"></span></div><main id="content"></main><div class="toc small">Standalone notes: choose a slide above. When opened through the deck’s Notes button, this window follows the projected slide and can control its builds.<br><a href="notes.md">Complete instructor notes</a> · <a href="index.html">Open student deck</a> · <a href="formulas.html">Formula reference</a> · <a href="deep-learning-architectures.pdf">Printable PDF</a></div><script>const NOTES=[{"title": "Deep learning architectures", "kind": "cover", "lines": [], "minutes": 0.5, "notes": "Open with the title only. Today we ask what changes when we change the connections between familiar artificial neurons.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {}, "appendix": false, "index": 0, "id": "slide-01", "start": 0, "end": 0.5, "part": "Recap", "line_steps": [], "content_steps": 0, "steps": 0, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "The same ingredients", "kind": "neuron", "lines": ["Inputs contribute through weights.", "A nonlinearity turns the sum into an output.", "Training changes the weights to reduce prediction error."], "minutes": 2, "notes": "Build input circles, weighted connections, then the output. Recap x, w and y from the previous lecture; h will mean a hidden representation. No biological equivalence is implied. Ask students to explain the effect of a negative weight rather than count arrows.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {}, "appendix": false, "index": 1, "id": "slide-02", "start": 0.5, "end": 2.5, "part": "Recap", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Inputs contribute through weights.", "Reveal: A nonlinearity turns the sum into an output.", "Reveal: Training changes the weights to reduce prediction error."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Architecture changes the information flow", "kind": "map", "lines": ["Layers combine features.", "Recurrence carries information through time.", "Convolution reuses a local pattern.", "Attention mixes information from context."], "minutes": 2.5, "notes": "Reveal the four sketches one at a time. LSTM and GRU belong inside the recurrence family. Explain that architecture constrains what information is accessible and what computations share weights. These are design choices, not a ranking from obsolete to best.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"rowCenters": [75, 220, 365, 510]}, "appendix": false, "index": 2, "id": "slide-03", "start": 2.5, "end": 5.0, "part": "Recap", "line_steps": [1, 2, 3, 4], "content_steps": 4, "steps": 4, "cue": ["Introduce the visible input or diagram.", "Reveal: Layers combine features.", "Reveal: Recurrence carries information through time.", "Reveal: Convolution reuses a local pattern.", "Reveal: Attention mixes information from context."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "A hidden layer creates a representation", "kind": "mlp", "lines": ["A hidden layer transforms the inputs.", "The output uses that transformed pattern."], "minutes": 1.5, "notes": "Trace a single input forward. The highlighted paths indicate flow, not measured activation magnitudes. Each circle is an artificial unit. Remind students that the hidden layer is learned together with the output.", "q": "If we freeze the hidden layer, what can training still change?", "a": "The output weights and bias can change. The hidden representation stays fixed.", "controls": "", "source": "", "figure": "", "cfg": {}, "appendix": false, "index": 3, "id": "slide-04", "start": 5.0, "end": 6.5, "part": "Multilayer networks", "line_steps": [1, 2], "content_steps": 3, "steps": 4, "cue": ["Introduce the visible input or diagram.", "Reveal: A hidden layer transforms the inputs.", "Reveal: The output uses that transformed pattern.", "Pause on the question; reveal the answer on the next click."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "A multilayer perceptron (MLP)", "kind": "mlp", "lines": ["The next layer combines features from the previous layer.", "Depth means repeated transformation."], "minutes": 1, "notes": "Reveal the second hidden layer before the output. Do not name individual units as semantic features unless demonstrated. Multiple layers permit compositional nonlinear functions; more layers alone do not guarantee better generalization.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"depth": 2}, "appendix": false, "index": 4, "id": "slide-05", "start": 6.5, "end": 7.5, "part": "Multilayer networks", "line_steps": [1, 2], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: The next layer combines features from the previous layer.", "Reveal: Depth means repeated transformation."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "XOR: one straight boundary is not enough", "kind": "xor-recap", "lines": ["Output 1 when exactly one input is 1.", "This straight boundary gets three of the four cases right.", "Moving the line cannot separate the two diagonals."], "minutes": 1, "notes": "Recap the same four Boolean XOR cases as the introductory lecture: (0,0) and (1,1) target 0; (0,1) and (1,0) target 1. Coordinates label the two inputs; dot colors and numbers are target outputs. First show the points, then the example line at input sum 0.5. The side above the line predicts 1, so (1,1) is wrong. This is one illustration, not a proof by testing a single line. Explain that both classes occupy opposite corners: the line would need to keep both ends of one diagonal together while excluding both ends of the other. No single affine decision boundary can do so.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"mode": "problem", "visualSteps": 3}, "appendix": false, "index": 5, "id": "slide-06", "start": 7.5, "end": 8.5, "part": "Multilayer networks", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Output 1 when exactly one input is 1.", "Reveal: This straight boundary gets three of the four cases right.", "Reveal: Moving the line cannot separate the two diagonals."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Two hidden units ask simpler questions", "kind": "xor-recap", "lines": [], "minutes": 1, "notes": "Reuse the hand-set step-function network from the introductory lecture exactly. h1=step(x1+x2−0.5); h2=step(x1+x2−1.5); step(z)=1 for z≥0, otherwise 0. Both input weights are +1 in each hidden unit. Keep the complete two-input, two-hidden-unit, one-output architecture visible. Reveal the h1 decision region while highlighting h1 and its two incoming connections; then reveal h2 while transferring that highlight to h2 and its incoming connections. The output and its incoming connections remain muted until the next slide combines these decisions. Panel colors and dot numbers now indicate the hidden unit output, not the XOR target. h1 outputs 0,1,1,1 and h2 outputs 0,0,0,1 for (0,0),(0,1),(1,0),(1,1). Each hidden unit makes a simple straight-boundary decision; neither alone solves XOR. The step functions convert continuous weighted sums into distinct features. Exact equations are in the separate formula reference document.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"mode": "hidden", "visualSteps": 2, "fullWidth": true}, "appendix": false, "index": 6, "id": "slide-07", "start": 8.5, "end": 9.5, "part": "Multilayer networks", "line_steps": [], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Combine the hidden decisions to solve XOR", "kind": "xor-recap", "lines": [], "minutes": 1, "notes": "Use the original output unit: predicted y=step(h1−2h2−0.5). Thus hidden (0,0) produces 0, (1,0) produces 1, and (1,1) produces 0. Keep exactly the same network layout and notation as the preceding slide. Reveal the lower h1 threshold while highlighting h1 and its path to the output, then reveal the upper h2 threshold while highlighting h2 and its path to the output. Finally reveal the class-1 region between them while highlighting the output and both hidden-to-output connections. The captions accept at least one, reject both, and exactly one appear with their corresponding stages. The network remains visible throughout. The final output is 1 exactly when 0.5≤x1+x2<1.5, solving all four Boolean cases. The lower boundary is included because step(0)=1; the upper boundary is excluded because h2 turns on there and suppresses the output. Filled regions show this hand-set model’s predictions on real-valued inputs; XOR itself is defined here only on the four Boolean cases. This is not a learned model and no uncertainty interval applies. Without nonlinear hidden activations, stacked affine computations reduce to one affine score, leaving the original XOR limitation unchanged. Spend about three minutes across this recap.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"mode": "solution", "visualSteps": 3, "fullWidth": true}, "appendix": false, "index": 7, "id": "slide-08", "start": 9.5, "end": 10.5, "part": "Multilayer networks", "line_steps": [], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Learn this decision boundary with two hidden units", "kind": "exercise", "lines": [], "minutes": 3, "notes": "Present only the target screenshot, task title and standard Playground link. Students choose the inputs, activation and training settings themselves; the assignment constrains the architecture to two hidden units. The link has no preset parameters. Instructor reference, to use only if students need help: one layer of two Tanh units, raw x1/x2 inputs, XOR data, learning rate 0.1, noise 0, no regularization, batch size 30, 50% training split, seed 0.70561. A prior recorded run at epoch 5257 gave training loss 0.142 and test loss 0.222 (outputs/playground-exercises/xor-two-units.jpg). This reference is an approximate diagonal band on the continuous Playground XOR dataset, not a perfect fit to every point. Do not require zero loss or disclose the reference settings before students explore. The provided screenshot is embedded without alteration. Three minutes are reserved in the 90-minute lecture; allow longer practice outside class if desired.", "q": "", "a": "", "controls": "", "source": "", "figure": "xor-playground", "cfg": {"enlarged": true, "lineSteps": [], "visualSteps": 0, "link": "https://playground.tensorflow.org/", "linkLabel": "Neural Network Playground", "linkOnly": true, "providedScreenshot": true}, "appendix": false, "index": 8, "id": "slide-09", "start": 10.5, "end": 13.5, "part": "Multilayer networks", "line_steps": [], "content_steps": 0, "steps": 0, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "User-provided Playground screenshot, displayed without alteration."}, {"title": "Semantic memory", "kind": "semantic-memory", "lines": [], "minutes": 1, "notes": "Use the four photographs and examples from the supplied lecture, slides 56–58. Begin with the pictures alone. Reveal their names, then shared properties. Knowing that a canary is a bird and can sing is semantic knowledge; remembering the particular occasion on which one first saw it is episodic memory. Keep that contrast in narration. These photographs are examples of concepts, not the visual inputs to the later localist-item network. Source deck: https://docs.google.com/presentation/d/1Rp3A6j6XdjeE8fW5WssMQgnmg0nnPFt4hB4SoqHLpQQ/edit . Definition: Tulving (1972), summarized by Tulving (1987), https://garfield.library.upenn.edu/classics1987/A1987K743800001.pdf .", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"fullWidth": true, "visualSteps": 2, "assets": ["sem-robin", "sem-canary", "sem-rose", "sem-daisy"], "mode": "memory"}, "appendix": false, "index": 9, "id": "slide-10", "start": 13.5, "end": 14.5, "part": "Multilayer networks", "line_steps": [], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Concepts have a similarity structure", "kind": "semantic-space", "lines": ["Similar concepts evoke similar neural patterns."], "minutes": 2, "notes": "Combine the earlier concept-space illustration with the new-bird generalization example. Build 0: show the familiar birds and flowers in the same schematic space. Build 1: reveal only the sentence Similar concepts evoke similar neural patterns on the right. Build 2: reveal the new bird photograph beneath that sentence, without a label or species name; invite students to apply their existing bird knowledge. Build 3: replace the left illustration with a large excerpt of the supplied news screenshot, preserving its headline, date and introductory paragraph. Keep the new bird photo and the sentence visible. The screenshot is from Natali Anderson, New Songbird Species Discovered in Bolivia, Sci.News, January 5, 2026: https://www.sci.news/biology/beni-greenlet-hylophilus-moxensis-14464.html . The Beni greenlet, Hylophilus moxensis, was formally described in 2026; the population had been observed decades earlier. Photograph credited in that article to Tini Wijpkema. The photo comes from the supplied lecture and the screenshot is the user’s attachment. Photo positions stand schematically for activity patterns, not measured brain responses or a numerical simulation. Each illustrative axis is one unit’s activity. Similarity supports expectations about a new bird but does not guarantee every bird flies or sings. The later eight-item Rumelhart model uses localist item inputs and does not directly accept an unseen bird photograph; generalization to novel items requires shared feature inputs or a learned mapping into the representation. Source lecture: https://docs.google.com/presentation/d/1Rp3A6j6XdjeE8fW5WssMQgnmg0nnPFt4hB4SoqHLpQQ/edit , slides 59–61 and 91–94.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"fullWidth": true, "keepAside": true, "visualSteps": 3, "lineSteps": [1], "assets": ["sem-robin", "sem-canary", "sem-rose", "sem-daisy", "sem-new-bird", "sem-new-bird-news"], "mode": "space"}, "appendix": false, "index": 10, "id": "slide-11", "start": 14.5, "end": 16.5, "part": "Multilayer networks", "line_steps": [1], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Similar concepts evoke similar neural patterns."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Broad and fine semantic distinctions", "kind": "semantic-motivation", "lines": ["Development: broad categories can emerge before finer distinctions.", "Semantic dementia: distinctive knowledge can be more vulnerable.", "What learning process could produce this structure?"], "minutes": 1, "notes": "Use the bird/flower concept-space figure from supplied slides 62–64 to motivate a model. The sketch is an illustration, not infant neural recordings. Mandler and McDonough (1993) studied conceptual categorization in 7–11-month-olds: 9- and 11-month-olds differentiated animals from vehicles, but did not differentiate dogs from fish or rabbits in that task. Do not attribute the exact robin/canary versus animal/plant picture to that experiment, and do not claim that infants universally lack fine perceptual discrimination. Their paper explicitly contrasts conceptual and perceptual tasks. https://doi.org/10.1016/S0885-2014(93)80003-C . Rogers et al. (2004) discuss selective progressive loss of conceptual knowledge: distinctive information can be more vulnerable than broad shared information. https://web.stanford.edu/~jlmcc/papers/RogersETAL04.pdf . Their recurrent semantic-dementia model is not identical to the feedforward Rumelhart architecture taught here. The point is a cognitive pattern for a learning account to explain, not proof that this exact network is the human mechanism. Source deck: https://docs.google.com/presentation/d/1Rp3A6j6XdjeE8fW5WssMQgnmg0nnPFt4hB4SoqHLpQQ/edit .", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"enlarged": true, "visualSteps": 3, "lineSteps": [1, 2, 3], "assets": ["sem-robin", "sem-canary", "sem-rose", "sem-daisy"], "mode": "motivation", "claimCitations": {"0": {"label": "Mandler & McDonough (1993)", "url": "https://www.sciencedirect.com/science/article/pii/S088520149380003C"}, "1": {"label": "Rogers et al. (2004)", "url": "https://web.stanford.edu/~jlmcc/papers/RogersETAL04.pdf"}}}, "appendix": false, "index": 11, "id": "slide-12", "start": 16.5, "end": 17.5, "part": "Multilayer networks", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Development: broad categories can emerge before finer distinctions.", "Reveal: Semantic dementia: distinctive knowledge can be more vulnerable.", "Reveal: What learning process could produce this structure?"], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Semantic knowledge as a prediction task", "kind": "figure", "lines": ["Eight item inputs and four relation inputs.", "One item and one relation are selected for each query.", "“Canary” + “can” → grow, move, fly, sing."], "minutes": 2, "notes": "Published Figure 2.2, printed p.31, author manuscript PDF p.43. This is Rogers and McClelland’s adaptation of the Rumelhart feedforward model, with the entire set of units shown. Item inputs are localist: one unit for each of eight items, with the selected item set to 1 and the others set to 0. A separate input pool selects one of four relations: ISA, is, can, has. The item pool projects to a learned distributed representation layer; this representation and the relation pool project to the hidden layer, which predicts attributes. Where connections are indicated, all units in the source pool connect to all units in the destination pool. The black item and relation units indicate the canary/can query; black attribute units show its target completions grow, move, fly and sing. Do not interpret the item unit as the model’s only input or as one biological canary neuron. Source caption contains an apparent robin/canary typo; the selected unit is labelled canary in the figure. Preserve the original diagram unchanged.", "q": "", "a": "", "controls": "", "source": "Rogers & McClelland (2004), Semantic Cognition · Chs. 2–3 · Figure 2.2", "figure": "rumelhart", "cfg": {"tall": true, "visualSteps": 0}, "appendix": false, "index": 12, "id": "slide-13", "start": 17.5, "end": 19.5, "part": "Multilayer networks", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Eight item inputs and four relation inputs.", "Reveal: One item and one relation are selected for each query.", "Reveal: “Canary” + “can” → grow, move, fly, sing."], "references": [["Rogers & McClelland (2004) · Semantic Cognition", "https://web.stanford.edu/~jlmcc/papers/RogersMcCBook_7_03.pdf"]], "visual_note": "Original published figure; axes, colors, labels and uncertainty retain the source meaning."}, {"title": "Read a distributed representation", "kind": "pattern", "lines": ["Each column is a Representation-layer unit.", "Each row shows the unit activations for one item.", "Similar patterns can support similar predictions."], "minutes": 1, "notes": "Use the illustrative matrix only to explain how to read the forthcoming original figure. Values are hand specified, not trained or biological recordings. Two plants share a pattern; two birds share a different one. A unit can contribute to multiple items. This matrix previews the Representation layer in the Rogers–McClelland architecture, not its separate later Hidden layer. The forthcoming source figure shows eight learned Representation-layer units.", "q": "Does a similar pattern require one “plant neuron”?", "a": "No. Similarity can be distributed across several units.", "controls": "", "source": "", "figure": "", "cfg": {}, "appendix": false, "index": 13, "id": "slide-14", "start": 19.5, "end": 20.5, "part": "Multilayer networks", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 4, "cue": ["Introduce the visible input or diagram.", "Reveal: Each column is a Representation-layer unit.", "Reveal: Each row shows the unit activations for one item.", "Reveal: Similar patterns can support similar predictions.", "Pause on the question; reveal the answer on the next click."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Learning separates semantic structure", "kind": "figure", "lines": ["Representation layer: eight learned units.", "Each bar is one unit’s activation for the item in its row.", "Columns: training epochs 50, 100 and 150.", "Related items develop similar activation patterns.", "The task and training experience shape this semantic structure."], "minutes": 2.5, "notes": "Published Figure 3.1, book p.47, author manuscript PDF p.59. Rows: eight items; bars: activations of the eight units in the Representation layer of Figure 2.2, not the later Hidden layer or the Attribute outputs; columns: epochs 50, 100, 150. Activate one Item input at a time; each row is the resulting representation pattern. The ordering of the eight units stays fixed across rows and epochs. Reveal the three columns in sequence. Focus on pine/oak versus rose/daisy. Deterministic model snapshots, not participant means; no confidence interval applies. Consolidate the former semantic-summary slide here: learning a shared property-prediction task organizes conceptual similarity. The item input is localist, while the learned representation is distributed. This is a computational account, not a measurement of human neural activity, and later recurrent semantic models should not be conflated with this feedforward model.", "q": "", "a": "", "controls": "", "source": "Rogers & McClelland (2004), Semantic Cognition · Chs. 2–3", "figure": "semantic", "cfg": {"columns": 3, "lineStart": 0, "lineSteps": [0, 1, 1, 2, 3], "visualSteps": 2}, "appendix": false, "index": 14, "id": "slide-15", "start": 20.5, "end": 23.0, "part": "Multilayer networks", "line_steps": [0, 1, 1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Representation layer: eight learned units.", "Reveal: Each bar is one unit’s activation for the item in its row.", "Reveal: Columns: training epochs 50, 100 and 150.", "Reveal: Related items develop similar activation patterns.", "Reveal: The task and training experience shape this semantic structure."], "references": [["Rogers & McClelland (2004) · Semantic Cognition", "https://web.stanford.edu/~jlmcc/papers/RogersMcCBook_7_03.pdf"]], "visual_note": "Original published figure; axes, colors, labels and uncertainty retain the source meaning."}, {"title": "Learning differentiates concepts gradually", "kind": "semantic-trajectories", "lines": [], "minutes": 1.5, "notes": "Include the user-supplied 2D and 3D MDS trajectory figure from slides 86–87, preserving all curves, colors, axis labels and the shared legend. It is a model illustration from the supplied lecture; no new simulation is being claimed. This classroom simulation includes Shark rather than the book figure’s Sunfish and uses a different training schedule; do not present it as the exact same run as Rogers and McClelland Figure 3.1. The plotted activity is labelled Hidden Representation in the source simulation. MDS means multidimensional scaling: its coordinates summarize the similarities between many-unit representation patterns. These axes are summary coordinates, not individual neurons and not training epochs. Each colored curve traces one concept’s representation across training snapshots. Initially show the 2D view and legend. Reveal the 3D view with the next click, then explain the interpretation. The original GIF is a rotating view of fixed trajectories; do not autoplay it or present rotation as learning. The image starts with a common red cluster and shows separation into broader and finer distinctions. The curves do not establish a literal measurement of infant brain development. Source deck: https://docs.google.com/presentation/d/1Rp3A6j6XdjeE8fW5WssMQgnmg0nnPFt4hB4SoqHLpQQ/edit , slides 86–87; attached figure supplied by the user. See also Saxe, McClelland and Ganguli (2019), https://doi.org/10.1073/pnas.1820226116 .", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"fullWidth": true, "visualSteps": 2, "assets": ["semantic-trajectories"], "mode": "trajectories", "providedScreenshot": true}, "appendix": false, "index": 15, "id": "slide-16", "start": 23.0, "end": 24.5, "part": "Multilayer networks", "line_steps": [], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "User-provided semantic-model trajectories. Original curves, colors, axes and legend are retained; the former heading is cropped and panels are revealed manually. MDS coordinates summarize representation similarity; they are not individual neural units or training time."}, {"title": "The same word can need different context", "kind": "history", "lines": ["“She walked along the river bank.”", "“She deposited money at the bank.”", "Context helps distinguish the meanings."], "minutes": 1.5, "notes": "Begin with bank alone and pause to let students notice the ambiguity. First reveal river on the left, its connection to bank, and the river sentence together. Then reveal money on the left with a second bank and the money sentence. The final build states what the preceding context contributes. These are everyday teaching examples, not the sentences in Elman’s experiment. Invite students to explain what information a memoryless word classifier would be missing.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"visualSteps": 3, "lineSteps": [1, 2, 3]}, "appendix": false, "index": 16, "id": "slide-17", "start": 24.5, "end": 26.0, "part": "Recurrent networks & temporal context", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: “She walked along the river bank.”", "Reveal: “She deposited money at the bank.”", "Reveal: Context helps distinguish the meanings."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Recurrent neural network (RNN)", "kind": "rnn", "lines": ["The new hidden state uses the input and the old hidden state.", "The state carries information from earlier inputs."], "minutes": 2, "notes": "Start with Olah’s rolled RNN, then show the single-tanh repeating module. Introduce h as a vector of hidden-unit activities. A recurrence does not mean copying the raw sentence. Distinguish stored activity from trained weights, which do not change on each forward step. Use Olah’s rolled RNN first, then his single-tanh repeating module. In these diagrams h is the hidden state; a separate prediction head is omitted. A denotes the repeated recurrent computation, not an individual neuron.", "q": "", "a": "", "controls": "", "source": "Christopher Olah (2015) · Understanding LSTM Networks", "figure": "olah-rnn", "cfg": {"wideRnn": true, "sequence": ["olah-rnn", "olah-rdl-simple"], "visualSteps": 2, "lineSteps": [1, 2]}, "appendix": false, "index": 17, "id": "slide-18", "start": 26.0, "end": 28.0, "part": "Recurrent networks & temporal context", "line_steps": [1, 2], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram.", "Reveal: The new hidden state uses the input and the old hidden state.", "Reveal: The state carries information from earlier inputs."], "references": [["Christopher Olah (2015) · Understanding LSTM Networks", "https://colah.github.io/posts/2015-08-Understanding-LSTMs/"]], "visual_note": "Original published figure; axes, colors, labels and uncertainty retain the source meaning."}, {"title": "Unroll the network through time", "kind": "unroll", "lines": ["One recurrent network, shown at several moments.", "The same weights are reused at every step."], "minutes": 2, "notes": "Reveal three time steps manually using the same authored architecture and node positions as the later Elman example. Every column is a moment, not a new layer with new weights. Inputs x1, x2 and x3 appear above hidden states h1, h2 and h3; prediction vectors appear below. The separate h0 node is the initial hidden state before x1, consistent with the numerical demo and the Elman example. Each circle represents a vector, not one biological neuron. The hidden-to-hidden links carry the previous state; recurrent and prediction weights are reused at every time step. The Elman slide adds word labels and next-word targets to this identical diagram. Shared weights make variable-length sequences possible. This is an authored schematic of recurrence, not a reproduced source figure.", "q": "", "a": "", "controls": "", "source": "Christopher Olah (2015) · Understanding LSTM Networks", "figure": "", "cfg": {"visualSteps": 3}, "appendix": false, "index": 18, "id": "slide-19", "start": 28.0, "end": 30.0, "part": "Recurrent networks & temporal context", "line_steps": [1, 2], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: One recurrent network, shown at several moments.", "Reveal: The same weights are reused at every step."], "references": [["Christopher Olah (2015) · Understanding LSTM Networks", "https://colah.github.io/posts/2015-08-Understanding-LSTMs/"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Watch a context update", "kind": "state", "lines": ["h = tanh(input + 0.8 × previous h)", "Compare a first input of +1 with a first input of −1. All later inputs are 0."], "minutes": 2.5, "notes": "A one-dimensional, hand-set RNN: h0=0, h_t=tanh(x_t+0.8h_(t−1)); no bias. Step through +1, 0, 0, 0, then use Change first input to repeat with −1, 0, 0, 0. After the first 0, the hidden state is approximately +0.544 or −0.544: the same current input produces different states because the first input changed the previous state. tanh outputs between −1 and 1. Explain tanh as a smooth response that stays between −1 and 1; no derivative is needed. This is an exact forward calculation, not a trained language model. Spend time reading the plot axes and the numeric equation.", "q": "After input 0, is the state the same if we started with +1 or −1?", "a": "No. The first input still affects the hidden state.", "controls": "state", "source": "", "figure": "", "cfg": {}, "appendix": false, "index": 19, "id": "slide-20", "start": 30.0, "end": 32.5, "part": "Recurrent networks & temporal context", "line_steps": [1, 2], "content_steps": 2, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: h = tanh(input + 0.8 × previous h)", "Reveal: Compare a first input of +1 with a first input of −1. All later inputs are 0.", "Pause on the question; reveal the answer on the next click."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Finding word boundaries without pauses", "kind": "speech-statistics", "lines": ["8-month-old infants heard two minutes of continuous artificial speech.", "Syllables within a word were more predictable than syllables across words.", "At test, infants distinguished words from sequences crossing a boundary."], "minutes": 1.5, "notes": "Saffran, Aslin & Newport (1996), Statistical Learning by 8-Month-Old Infants, Science 274:1926–1928. https://pubmed.ncbi.nlm.nih.gov/8943209/ ; doi:10.1126/science.274.5294.1926. Begin with the continuous orthographic example bidakupadotigolabubidaku from the paper. The infants heard synthesized continuous speech with no pauses, stress differences or other acoustic boundary cues. Build 1 expands the first two three-syllable words to show next-syllable predictability: within-word transitions 1.0; between-word transitions 0.33 in experiment 1, where four words occurred in random order with no immediate repetitions. Percentages summarize the familiarization corpus, not observations from the short displayed snippet or a fitted neural network. Build 2 marks bidaku and padoti as the underlying word groups; the marks are explanatory overlays, not pauses in the auditory input. Twenty-four infants in experiment 1 distinguished familiar words from nonwords. A separate group of twenty-four infants in experiment 2 distinguished words from part-words spanning a word boundary, listening longer to part-words (7.60 versus 6.77 seconds); this is the test finding on the slide. Experiment 2 used different four-word inventories in its two counterbalanced conditions. The tested part-words had a boundary transition probability of 0.33, followed by a within-word transition of 1.0. Do not present the illustrated experiment-1 sequence as its exact test material. Do not claim that the study demonstrated an Elman network in infants, that all natural boundaries have lower transition probability, or that statistical learning is the only cue to natural speech segmentation. Transition: how might a network learn such sequential regularities? The next slide introduces Elman’s prediction-learning approach. The next-word example is from Elman’s separate artificial-sentence experiment, not a simulation of Saffran’s infant study.", "q": "", "a": "", "controls": "", "source": "Saffran, Aslin & Newport (1996) · Statistical Learning by 8-Month-Old Infants", "figure": "", "cfg": {"lineSteps": [0, 1, 2], "visualSteps": 2}, "appendix": false, "index": 20, "id": "slide-21", "start": 32.5, "end": 34.0, "part": "Recurrent networks & temporal context", "line_steps": [0, 1, 2], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram.", "Reveal: 8-month-old infants heard two minutes of continuous artificial speech.", "Reveal: Syllables within a word were more predictable than syllables across words.", "Reveal: At test, infants distinguished words from sequences crossing a boundary."], "references": [["Saffran, Aslin & Newport (1996) · Statistical learning in infants", "https://pubmed.ncbi.nlm.nih.gov/8943209/"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Elman: predict the next word", "kind": "elman-task", "lines": ["Input: one word at a time.", "Training target: the following word.", "Hidden states can reflect distributional structure."], "minutes": 2, "notes": "Reuse the exact unrolled architecture, node positions, connections and x/h/ŷ notation introduced on the earlier unrolling slide. Connect the preceding infant example to the general question of learning sequence structure through prediction; this is a separate modeling example, not a reproduction of that infant experiment. Training compares next-word predictions with the following word and updates the shared weights. Initially show that familiar architecture. Build 1 adds boy, chases, dog above the input vectors; build 2 adds next-word targets under the output vectors; build 3 highlights the hidden-state row to introduce the forthcoming representation analysis. The illustration is not an assertion that these predictions are already correct. The third target is omitted with an ellipsis because the continuation is not specified. Each circle denotes an input, hidden-state or output vector, not one unit for an entire word. Elman’s original context units copy the previous hidden activities; the unrolled h-to-h links express the same memory dependency, with the copied state implicit. This notation does not claim that the original sigmoid model uses the toy tanh demo’s parameters or modern softmax. Elman’s 1990 paper has several demonstrations; focus on the simple-sentence word prediction experiment. Artificial sequences provided regularities without noun/verb category labels as targets. This is a cognitive modeling example, not a brain-recording experiment.", "q": "", "a": "", "controls": "", "source": "Elman (1990), Finding Structure in Time · Cognitive Science", "figure": "", "cfg": {"lineSteps": [1, 2, 3], "visualSteps": 3}, "appendix": false, "index": 21, "id": "slide-22", "start": 34.0, "end": 36.0, "part": "Recurrent networks & temporal context", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Input: one word at a time.", "Reveal: Training target: the following word.", "Reveal: Hidden states can reflect distributional structure."], "references": [["Elman (1990) · Finding Structure in Time", "https://jeffelman.ucsd.edu/research/publications/"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Structure appears in hidden states", "kind": "figure", "lines": ["Words clustered by the RNN’s hidden-layer activity.", "Each word is represented by an average pattern across 150 hidden units.", "The average combines the word’s occurrences in different sentence contexts.", "Words joining nearer the labels have more similar patterns."], "minutes": 2, "notes": "Published Figure 7, article p.200 (PDF p.22). This is a hierarchical clustering tree of words, not a network wiring diagram, brain anatomy, or clusters of individual hidden units. After training the simple recurrent next-word prediction model, freeze its weights and run the word stream through it. For every word occurrence, record the activations of the 150 hidden units after processing that word in context. Average those vectors separately for each of the 29 word types; then hierarchically cluster the 29 mean activation vectors. Leaves label the words that produced the vectors. Joins closer to the word labels indicate more similar average patterns; joins farther left merge more dissimilar clusters. Read mouse/cat and woman/girl as concrete examples. The unit order is the same in every vector. Noun and verb category annotations were not the next-word training targets. The original paper cautions that averaging can induce clustering artifacts; individual-token analyses are needed too. Figure is preserved, not a new clustering calculation.", "q": "", "a": "", "controls": "", "source": "Elman (1990), Finding Structure in Time · Cognitive Science", "figure": "elman", "cfg": {"lineStart": 0}, "appendix": false, "index": 22, "id": "slide-23", "start": 36.0, "end": 38.0, "part": "Recurrent networks & temporal context", "line_steps": [0, 1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Words clustered by the RNN’s hidden-layer activity.", "Reveal: Each word is represented by an average pattern across 150 hidden units.", "Reveal: The average combines the word’s occurrences in different sentence contexts.", "Reveal: Words joining nearer the labels have more similar patterns."], "references": [["Elman (1990) · Finding Structure in Time", "https://jeffelman.ucsd.edu/research/publications/"]], "visual_note": "Original published figure; axes, colors, labels and uncertainty retain the source meaning."}, {"title": "Human recall favors nearby studied items", "kind": "figure", "lines": ["People study a list, then freely recall its items.", "Horizontal axis: positions apart in the studied list.", "+1 means the item studied immediately after the one just recalled.", "Nearby items are more likely to be recalled next."], "minutes": 1.5, "notes": "Introduce the human free-recall finding before the temporal context model. Participants study a list and later recall its items without being required to preserve study order. One original curve is shown: Howard & Kahana Figure 1, panel E, reproduced from Kahana (1996). This curve collapses over conditions of Murdock & Okada (1970). The other five panels are omitted. Axis labels are repositioned for this single-panel excerpt; plotted points, connecting lines, ticks, and error bars are retained from the source. It is data motivating TCM, not a plotted fit from our demo. Lag zero is excluded. Original error bars are retained with their original meaning; do not relabel them as newly computed 95% CIs. Source caption identifies the conditions. After explaining the observed nearby-item advantage, transition with: how could a changing internal context produce this pattern? The next slide introduces the temporal context mechanism. The horizontal variable is signed study-list position lag, not elapsed time or the order of earlier recall responses. Recalling study item 5 then study item 6 gives lag +1; item 5 then item 4 gives lag −1. Positive lags move forward through the studied list. The vertical axis is conditional response probability among available transitions. Point out the forward asymmetry after explaining the axes.", "q": "", "a": "", "controls": "", "source": "Howard & Kahana (2002), Temporal Context Model · J. Mathematical Psychology", "figure": "tcm", "cfg": {"lineSteps": [0, 1, 2, 3], "visualSteps": 3}, "appendix": false, "index": 23, "id": "slide-24", "start": 38.0, "end": 39.5, "part": "Recurrent networks & temporal context", "line_steps": [0, 1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: People study a list, then freely recall its items.", "Reveal: Horizontal axis: positions apart in the studied list.", "Reveal: +1 means the item studied immediately after the one just recalled.", "Reveal: Nearby items are more likely to be recalled next."], "references": [["Howard & Kahana (2002) · Temporal Context Model", "https://memory.psych.upenn.edu/files/pubs/HowaKaha02.pdf"]], "visual_note": "Original published figure; axes, colors, labels and uncertainty retain the source meaning."}, {"title": "Temporal context explains nearby recall", "kind": "context", "lines": ["Each bar group is a context vector; darker bars mean stronger components.", "Nearby studied items acquire overlapping contexts.", "Recall reinstates context, which cues nearby items."], "minutes": 2.5, "notes": "Start from the human result on the preceding slide: why does recalling one item favor recall of its study-list neighbors? Howard and Kahana’s TCM: encoding and retrieval both change context; reinstated context helps cue neighboring list items. Teaching sketch shows apple, chair, river, lamp with overlapping contexts; it is not a full implementation or fitted recall simulation. Shared evolving-state idea links this to recurrence, but TCM has its own memory and retrieval mechanisms. Within a group, each bar position denotes a context component. Strength is encoded by darkness, not height; the bars have equal height. The same component positions are used across all four groups. Reveal the context vectors, explain their overlap for nearby studied items, then recall river and show its reinstated context cueing neighbors. Link the mechanism explicitly back to the human lag-CRP curve. This completes the four-minute data-to-model sequence. The simplified sketch explains the proximity intuition; it does not by itself derive the forward asymmetry or the numerical human curve. In the full model, retrieved context is an asymmetric retrieval cue, as explained in Howard and Kahana (2002).", "q": "If recalling “river” brings back its context, which items gain a useful cue?", "a": "Items studied near “river” share more of that context.", "controls": "", "source": "Howard & Kahana (2002), Temporal Context Model · J. Mathematical Psychology", "figure": "", "cfg": {"lineSteps": [1, 2, 3], "visualSteps": 3}, "appendix": false, "index": 24, "id": "slide-25", "start": 39.5, "end": 42.0, "part": "Recurrent networks & temporal context", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 4, "cue": ["Introduce the visible input or diagram.", "Reveal: Each bar group is a context vector; darker bars mean stronger components.", "Reveal: Nearby studied items acquire overlapping contexts.", "Reveal: Recall reinstates context, which cues nearby items.", "Pause on the question; reveal the answer on the next click."], "references": [["Howard & Kahana (2002) · Temporal Context Model", "https://memory.psych.upenn.edu/files/pubs/HowaKaha02.pdf"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Keeping a cue across a delay", "kind": "delay", "lines": ["The cue sets one memory unit’s activation to 1.", "With no new input, each step retains 65% of its previous activation.", "The cue’s signal becomes weaker across the delay."], "minutes": 2, "notes": "Distinguish two difficulties: forward state retention and backward credit assignment. The y-axis is the activation of one illustrative memory unit: the cue sets h₀ = 1, then hₜ = 0.65 × hₜ₋₁ while no new input enters. The unit is a simple linear recurrent unit with recurrent weight 0.65 and zero bias. A value of 1 is its starting activation; 0.5 is half that activation; 0 is no remaining cue signal in this scalar unit. This is an arbitrary activation scale, not biological firing rate or percentage of facts remembered. The x-axis counts time steps since the cue. This hand-set scalar decay illustrates only retention; it is not recall probability, measured human memory, a trained RNN result, or a training gradient. Vanishing gradients arise from repeated derivative factors during training, not simply because memory fades. Do not say all RNNs necessarily forget everything.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {}, "appendix": false, "index": 25, "id": "slide-26", "start": 42.0, "end": 44.0, "part": "Gated recurrence", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: The cue sets one memory unit’s activation to 1.", "Reveal: With no new input, each step retains 65% of its previous activation.", "Reveal: The cue’s signal becomes weaker across the delay."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "A gate is a learned amount", "kind": "gate", "lines": ["Current input and previous state determine the gate.", "A sigmoid turns their weighted sum into an amount from 0 to 1.", "Multiplication scales how much a signal contributes."], "minutes": 1.5, "notes": "Use a circle and arrow for the gate computation. Move g between 0, 0.5 and 1: g×0.8 yields 0, 0.4, 0.8. Explain that this is a continuous learned amount, not a physical switch. The slider is a manual intervention, not gate training.", "q": "", "a": "", "controls": "gate", "source": "", "figure": "", "cfg": {"lineSteps": [1, 1, 2], "visualSteps": 2}, "appendix": false, "index": 26, "id": "slide-27", "start": 44.0, "end": 45.5, "part": "Gated recurrence", "line_steps": [1, 1, 2], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram.", "Reveal: Current input and previous state determine the gate.", "Reveal: A sigmoid turns their weighted sum into an amount from 0 to 1.", "Reveal: Multiplication scales how much a signal contributes."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Long short-term memory (LSTM)", "kind": "lstm", "lines": ["The cell state carries information forward.", "The forget gate controls what to retain.", "The input gate controls what to write.", "Combine retained information with the new contribution.", "The output gate controls the visible hidden state."], "minutes": 2.5, "notes": "Use Olah’s highlighted diagrams in order: cell update path, forget gate, input gate and candidate, cell update, output gate. Main-slide crops retain the complete cell diagram and omit the dense equations beside it. Yellow boxes are learned neural-network layers; pink circles are elementwise operations. Lines carry vectors; merging means concatenation and branching means copying. Explain these symbols as each becomes relevant. Olah uses uppercase C for cell state; the scalar demo uses lowercase c for the same quantity. Modern forget-gate LSTM, not the exact original 1997 cell. The original LSTM is Hochreiter & Schmidhuber (1997); forget gates were introduced later (Gers et al., 2000). c and h are vectors. Multiplication is elementwise. A hidden state is not a biological neural firing model.", "q": "Can a stored cell value differ from the visible hidden output?", "a": "Yes. The output gate controls how much of tanh(cell) is exposed.", "controls": "", "source": "Christopher Olah (2015) · Diagram; Hochreiter & Schmidhuber (1997); Gers et al. (2000)", "figure": "olah-lstm", "cfg": {"sequence": ["olah-lstm", "olah-lstm-forget", "olah-lstm-input", "olah-lstm", "olah-lstm-output"], "visualSteps": 4, "lineSteps": [0, 1, 2, 3, 4]}, "appendix": false, "index": 27, "id": "slide-28", "start": 45.5, "end": 48.0, "part": "Gated recurrence", "line_steps": [0, 1, 2, 3, 4], "content_steps": 4, "steps": 5, "cue": ["Introduce the visible input or diagram.", "Reveal: The cell state carries information forward.", "Reveal: The forget gate controls what to retain.", "Reveal: The input gate controls what to write.", "Reveal: Combine retained information with the new contribution.", "Reveal: The output gate controls the visible hidden state.", "Pause on the question; reveal the answer on the next click."], "references": [["Christopher Olah (2015) · Understanding LSTM Networks", "https://colah.github.io/posts/2015-08-Understanding-LSTMs/"], ["Hochreiter & Schmidhuber (1997) · LSTM", "https://www.bioinf.jku.at/publications/older/2604.pdf"]], "visual_note": "Original published figure; axes, colors, labels and uncertainty retain the source meaning."}, {"title": "Preserve a value, then replace it", "kind": "lstm-demo", "lines": ["c = f × previous c + i × candidate", "h = o × tanh(c)"], "minutes": 1.5, "notes": "Use controlled presets: retain (f=1,i=0,o=1), partial write (f=0.5,i=0.5), replace (f=0,i=1), hide output (f=1,i=0,o=0). Fixed previous c=0.8 and candidate=−0.6. Values 0 and 1 are idealized gate endpoints; finite sigmoid logits approach rather than reach them. This is an arithmetic illustration, not an LSTM trained on a delay task.", "q": "", "a": "", "controls": "lstm", "source": "", "figure": "", "cfg": {}, "appendix": false, "index": 28, "id": "slide-29", "start": 48.0, "end": 49.5, "part": "Gated recurrence", "line_steps": [1, 2], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram.", "Reveal: c = f × previous c + i × candidate", "Reveal: h = o × tanh(c)"], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Gated recurrent unit (GRU)", "kind": "gru", "lines": ["One recurrent state, with no separate cell state.", "The update gate controls the old/new blend.", "Reset changes how the old state forms the candidate."], "minutes": 1.5, "notes": "Use Olah’s write convention: h=(1−z) h_prev+z candidate. z near 0 retains old state, and z near 1 writes the candidate. This complements the original Cho retention variable; do not mix the two conventions. The original diagram’s cell is shown intact, while its adjacent equations are reserved for the reference slide. Here candidate=tanh(x+0.8 r h_prev), x=−0.6, h_prev=0.8. Reset affects candidate computation; it does not directly erase the old-state route. The gates are manually controlled; actual GRUs learn their gate-producing weights. Keep the main numerical display focused on old state, candidate and their blended result. The candidate computation belongs in the separate formula reference. To test the question, set z=0, vary r, and observe h remains 0.8 while the candidate may change.", "q": "Set writing to 0. Does changing reset change the stored state?", "a": "No. With writing at 0, the old state is retained regardless of the candidate.", "controls": "gru", "source": "Christopher Olah (2015) · Diagram; Cho et al. (2014)", "figure": "olah-gru", "cfg": {}, "appendix": false, "index": 29, "id": "slide-30", "start": 49.5, "end": 51.0, "part": "Gated recurrence", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 4, "cue": ["Introduce the visible input or diagram.", "Reveal: One recurrent state, with no separate cell state.", "Reveal: The update gate controls the old/new blend.", "Reveal: Reset changes how the old state forms the candidate.", "Pause on the question; reveal the answer on the next click."], "references": [["Christopher Olah (2015) · Understanding LSTM Networks", "https://colah.github.io/posts/2015-08-Understanding-LSTMs/"], ["Cho et al. (2014) · RNN Encoder–Decoder / GRU", "https://aclanthology.org/D14-1179/"]], "visual_note": "Original published figure; axes, colors, labels and uncertainty retain the source meaning."}, {"title": "Same bird, different location", "kind": "bird-position", "lines": [], "minutes": 0.5, "notes": "Introduce the convolution section with the robin photograph used earlier in the semantic-memory slides. Show exactly the same crop and size at three different positions: left, upper right, then lower center. Each manual advance moves the photo; previous reverses the move. Leave only one instance visible so students compare position without a second changing property. Students can still recognize the bird at these different locations. Use this visual intuition to motivate recognizing a local pattern wherever it occurs; the next slide simplifies that problem to a moving vertical stripe. The photo includes its original background, so this is a translated photograph, not a bird segmented onto novel scenes. It illustrates robust recognition, not measured neural invariance or a claim that all CNNs are perfectly translation invariant. Source photograph is from the supplied lecture, as recorded in semantic-user-provenance.json.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {"fullWidth": true, "visualSteps": 2, "assets": ["sem-robin"]}, "appendix": false, "index": 30, "id": "slide-31", "start": 51.0, "end": 51.5, "part": "Convolutional networks", "line_steps": [], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "A visual pattern can move", "kind": "image", "lines": ["The same edge can appear in different places.", "A dense network gives each location separate weights.", "A convolution reuses a local detector."], "minutes": 1.5, "notes": "Compare two binary images with a shifted vertical stripe. Avoid claiming complete translation invariance: convolution is approximately translation equivariant away from boundary effects, and classifier robustness depends on architecture/training.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {}, "appendix": false, "index": 31, "id": "slide-32", "start": 51.5, "end": 53.0, "part": "Convolutional networks", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: The same edge can appear in different places.", "Reveal: A dense network gives each location separate weights.", "Reveal: A convolution reuses a local detector."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "One patch produces one number", "kind": "conv", "lines": [], "minutes": 3, "notes": "Start with the 5×5 binary image and its highlighted 3×3 window. Build 1 extracts the patch, places it beside the fixed filter, and shows all nine cellwise products. The blue box identifies the corresponding entry in all three grids; use Next cell or click a cell to trace its contribution. Build 2 adds those nine products into one output. Change the patch to encounter a positive response, zero response and negative response. Input intensity is grayscale; blue and orange indicate signed numerical contributions. The filter is hand specified, stride 1, no padding, no bias. This implements the cross-correlation convention used by CNN libraries. The brief outline movement is lecturer-triggered and respects reduced-motion settings.", "q": "", "a": "", "controls": "conv-patch", "source": "", "figure": "", "cfg": {"mode": "patch", "convLab": true, "visualSteps": 2, "controlStep": 1}, "appendix": false, "index": 32, "id": "slide-33", "start": 53.0, "end": 56.0, "part": "Convolutional networks", "line_steps": [], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Build a feature map one position at a time", "kind": "conv", "lines": [], "minutes": 3, "notes": "The filter weights stay fixed. At build 1 the first output is revealed. Next position slides the 3×3 window by one pixel and fills exactly one corresponding cell; previously filled cells remain visible. Previous position reverses this sequence. Reveal map fills all nine positions at once if needed. Restart clears the progress back to the first position. Build 2 adds ReLU beside the raw map so negative responses visibly become zero. Changing or shifting the input resets the scan. For the original vertical stripe, each raw row is [3,0,−3] and each ReLU row is [3,0,0]. After shifting right, raw rows are [0,3,0]. After the next shift the stripe reaches the right edge; repeated shifts may remove it. Blank output cells have not yet been visited. The source image, active window and highlighted output remain linked.", "q": "", "a": "", "controls": "conv-map", "source": "", "figure": "", "cfg": {"mode": "map", "convLab": true, "visualSteps": 2, "controlStep": 1}, "appendix": false, "index": 33, "id": "slide-34", "start": 56.0, "end": 59.0, "part": "Convolutional networks", "line_steps": [], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Two filters, two different feature maps", "kind": "filters", "lines": [], "minutes": 2, "notes": "Use the same input image for the vertical and horizontal filters. Reveal the vertical branch at build 1 and horizontal branch at build 2. Each filter has one separately labeled raw response map; no ReLU is applied on this comparison slide. A vertical stripe produces rows [3,0,−3] for the vertical filter and zeros for the horizontal filter. A horizontal stripe reverses their roles: the horizontal map has rows [3,3,3], [0,0,0], [−3,−3,−3]. Use the Vertical, Horizontal and Corner presets, or edit individual input pixels by clicking the grayscale image. Every edit recomputes both maps. These filters detect the shown polarity of an edge; a sign reversal gives a negative response. Training would normally learn the filter values. This is an exact teaching demonstration, not a trained vision model.", "q": "", "a": "", "controls": "conv-filters", "source": "", "figure": "", "cfg": {"mode": "filters", "convLab": true, "visualSteps": 2, "controlStep": 1}, "appendix": false, "index": 34, "id": "slide-35", "start": 59.0, "end": 61.0, "part": "Convolutional networks", "line_steps": [], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "AlexNet: a convolutional neural network", "kind": "cnn", "lines": [], "minutes": 2, "notes": "Redrawn from the instructor-provided architecture diagram in Ignacio Quintero’s AlexNet blog post: https://medium.com/@igquinteroch/understanding-alexnet-the-2012-breakthrough-that-redefined-ai-d0e267e2470a . Build 0: RGB input. Build 1: five convolutional feature-map volumes and pooling after Conv1 and Conv2. Build 2: pooling after Conv5 and the three fully connected layers. Build 3: the ImageNet result. Dimensions are height × width × channels; FC numbers count units. Volumes depict stacks of spatial feature maps, not individual neurons, and their drawn proportions are schematic. The 227-pixel input convention follows the supplied diagram; with an unpadded 11×11 stride-4 first convolution it produces 55×55 maps. The original paper reports 224-pixel crops; implementations differ in input/padding conventions. Max pooling reduces 55→27, 27→13 and 13→6; final pooled representation is 6×6×256. ReLU, normalization, dropout and two-GPU grouping are omitted from the overview. Source: Krizhevsky, Sutskever & Hinton (2012), ImageNet Classification with Deep Convolutional Neural Networks, https://www.cs.toronto.edu/~hinton/absps/imagenet.pdf . Five convolutional plus three fully connected learned layers. The winning 2012 entry was an ensemble of AlexNet-family networks, not one network in isolation; its top-5 test error was 15.3%. Top-5 error means the correct class is absent from the five highest-ranked predictions. The result helped establish large trained CNNs as a practical approach to image recognition.", "q": "", "a": "", "controls": "", "source": "Krizhevsky, Sutskever & Hinton (2012) · ImageNet classification with deep CNNs", "figure": "", "cfg": {"fullWidth": true, "visualSteps": 3}, "appendix": false, "index": 35, "id": "slide-36", "start": 61.0, "end": 63.0, "part": "Convolutional networks", "line_steps": [], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram."], "references": [["Krizhevsky, Sutskever & Hinton (2012) · AlexNet", "https://www.cs.toronto.edu/~hinton/absps/imagenet.pdf"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Compare a visual model with cortex", "kind": "readout", "lines": ["Optimize the model for object recognition.", "Fit a readout to predict the recorded neural responses.", "Compare predictions with recordings for held-out images."], "minutes": 1.5, "notes": "Yamins et al. compared hierarchical convolutional models with macaque IT responses; also studied V4. Freeze the task model for the neural comparison, fit a separate linear readout, and test on novel images. Readout fitting uses neural training data even though task optimization need not. Two distinct goals: recognize objects versus predict neural responses. The anatomical human-brain image is a generic symbol for the neural-recording branch, not measured activation data or a localization map. Image: NIAID Visual & Medical Arts, Ryan Kissinger (2024), Brain Lateral, NIH BioArt BIOART-000060, public domain, courtesy of NIAID; https://bioart.niaid.nih.gov/bioart/60. The Yamins visual study used macaque recordings despite this generic human-brain icon. Follow two branches from the same image: model → representations → predicted responses, and participant brain → recorded responses. Predictions and recordings meet at Compare; neither branch generates the other. Fitting uses training images and evaluation uses different images.", "q": "Why test the readout on different images?", "a": "To test generalization instead of measuring how well it fits the training images.", "controls": "", "source": "Yamins et al. (2014) · PNAS · doi:10.1073/pnas.1403112111", "figure": "", "cfg": {"domain": "vision", "lineSteps": [1, 3, 4], "visualSteps": 4}, "appendix": false, "index": 36, "id": "slide-37", "start": 63.0, "end": 64.5, "part": "Convolutional networks", "line_steps": [1, 3, 4], "content_steps": 4, "steps": 5, "cue": ["Introduce the visible input or diagram.", "Reveal: Optimize the model for object recognition.", "Reveal: Fit a readout to predict the recorded neural responses.", "Reveal: Compare predictions with recordings for held-out images.", "Pause on the question; reveal the answer on the next click."], "references": [["Yamins et al. (2014) · Visual cortex", "https://doi.org/10.1073/pnas.1403112111"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Task performance and IT predictivity", "kind": "figure", "lines": [], "minutes": 2.5, "notes": "Published Figure 1A–B, p.8620. The figure fills the slide; there is no right-hand explanatory text. Explain aloud: right means better categorization, up means more IT response variance explained, and each point is a different model. Focus first on A; B extends the comparison to other models. x=balanced categorization accuracy, chance0.5; y=median explained variance across168 IT sites. Green=random selection; blue=categorization optimization; orange=IT fitting optimization. In B, red squares trace HMO optimization, black circles are controls/published models, and light-blue circles repeat task-optimized models. The purple category ideal observer is not an image-computable model. Reveal axes, then discuss trend. Preserve all original color coding and annotations. No newly calculated uncertainty. This result concerns tested hierarchical model families.", "q": "", "a": "", "controls": "", "source": "Yamins et al. (2014) · PNAS · doi:10.1073/pnas.1403112111", "figure": "yamins", "cfg": {"fullWidth": true, "visualSteps": 0}, "appendix": false, "index": 37, "id": "slide-38", "start": 64.5, "end": 67.0, "part": "Convolutional networks", "line_steps": [], "content_steps": 0, "steps": 0, "cue": ["Introduce the visible input or diagram."], "references": [["Yamins et al. (2014) · Visual cortex", "https://doi.org/10.1073/pnas.1403112111"]], "visual_note": "Original published figure; axes, colors, labels and uncertainty retain the source meaning."}, {"title": "What the visual-cortex result supports", "kind": "claim", "lines": ["In these models, stronger object recognition tended to accompany better IT predictions.", "Task optimization can help identify useful representations."], "minutes": 1.5, "notes": "The bounded statement matters: not a theorem that any optimization, task or architecture always increases brain predictivity. Distinguish correspondence after a fitted readout from a neuron-to-unit identity. Note intermediate model layers were useful for V4, without adding another dense figure.", "q": "", "a": "", "controls": "", "source": "Yamins et al. (2014) · PNAS · doi:10.1073/pnas.1403112111", "figure": "", "cfg": {"textOnly": true, "lineSteps": [1, 2], "visualSteps": 0}, "appendix": false, "index": 38, "id": "slide-39", "start": 67.0, "end": 68.5, "part": "Convolutional networks", "line_steps": [1, 2], "content_steps": 2, "steps": 2, "cue": ["Introduce the visible input or diagram.", "Reveal: In these models, stronger object recognition tended to accompany better IT predictions.", "Reveal: Task optimization can help identify useful representations."], "references": [["Yamins et al. (2014) · Visual cortex", "https://doi.org/10.1073/pnas.1403112111"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Transformers: represent a word using its context", "kind": "tokens", "lines": ["Each word starts with a vector.", "Bidirectional attention uses words before and after it.", "Positions can be processed in parallel."], "minutes": 2.5, "notes": "Introduce full bidirectional self-attention using a selected middle word, cat, so context visibly arrives from both its left and its right. Build 0 shows the words. Build 1 reveals the starting vector strips. Build 2 shows context flowing directly from The, saw and it into cat and an illustrative changed cat representation. Build 3 shows updated representations at all positions: these can be computed in parallel within a layer when the input sequence is available. Only paths into the selected word are drawn, to keep the figure readable. These are schematic representations, not model activations or evidence about a grammatical dependency. BERT-style encoders use full bidirectional self-attention. GPT-style next-token decoders use causal attention, accessing the current and earlier positions; do not call all transformers bidirectional. The original Transformer has a bidirectional encoder and a causally masked decoder. Bidirectional RNNs also exist: bidirectionality alone is not the distinguishing advantage. Attention directly mixes representations across positions without carrying context through a succession of recurrent states, and transformer layers can process the supplied positions in parallel. Autoregressive generation still emits tokens sequentially. Word-like tokens are used for readability; real models often use subwords. Position information remains important, though omitted from this overview; implementations differ, with learned position embeddings in GPT-2. Vector components have learned roles rather than hand-assigned meanings. Sources: Vaswani et al. (2017), https://arxiv.org/abs/1706.03762 ; Devlin et al. (2019), https://aclanthology.org/N19-1423/ .", "q": "", "a": "", "controls": "", "source": "Vaswani et al. (2017); Devlin et al. (2019)", "figure": "", "cfg": {"defaultRow": 1, "bidirectional": true, "lineSteps": [1, 2, 3], "visualSteps": 3}, "appendix": false, "index": 39, "id": "slide-40", "start": 68.5, "end": 71.0, "part": "Transformers & attention", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Each word starts with a vector.", "Reveal: Bidirectional attention uses words before and after it.", "Reveal: Positions can be processed in parallel."], "references": [["Vaswani et al. (2017) · Attention Is All You Need", "https://arxiv.org/abs/1706.03762"], ["Devlin et al. (2019) · BERT", "https://aclanthology.org/N19-1423/"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Attention weights control the information flow", "kind": "attention", "lines": ["Each word can use context from both directions.", "Multiply each word’s information by its attention weight.", "Add the weighted information to form an attention update."], "minutes": 2.5, "notes": "This is a full bidirectional attention example. Start with cat, a middle word, as the selected destination so its update visibly uses The on its left and saw and it on its right. Changing the dropdown recomputes all four attention weights; no positions are hidden. Build 0 shows words. Build 1 adds attention bars and rounded percentages. Build 2 adds one info circle per word and paths into an addition node. An info circle denotes the information a token can contribute, formally its value vector, without claiming particular vector dimensions or component magnitudes. Path width encodes attention weight, not value-vector magnitude or causal impact on the final prediction, with a minimum visible stroke. Build 3 reveals the mixed information for the selected word. This is one head’s output before the multi-head output projection and residual addition, not a predicted word. The projections and weights are hand specified, not trained language-model results; they establish no grammatical or coreference interpretation. Verification for cat: q=[1,0], keys=[[0,0],[2,0],[0,1],[1,0]], values=[[0,0],[1,0],[0,1],[0.5,0.5]]. Divide query–key dot products by sqrt(2), giving [0,1.414213562,0,0.707106781]. Softmax gives [0.122829520,0.505228570,0.122829520,0.249112390]. Weighted value contributions are [0,0], [0.505228570,0], [0,0.122829520], [0.124556195,0.124556195], with output [0.629784765,0.247385715]. Values round independently for display. For The, full attention yields four weights of 0.25 and output [0.375,0.375]. This full-context example is distinct from the GPT-2 next-token model in the later class demo. Source: Vaswani et al. (2017), section 3.2.1, https://arxiv.org/abs/1706.03762 .", "q": "", "a": "", "controls": "attention", "source": "", "figure": "", "cfg": {"mode": "flow", "enlarged": true, "defaultRow": 1, "bidirectional": true, "controlStep": 1, "lineSteps": [1, 2, 3], "visualSteps": 3}, "appendix": false, "index": 40, "id": "slide-41", "start": 71.0, "end": 73.5, "part": "Transformers & attention", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Each word can use context from both directions.", "Reveal: Multiply each word’s information by its attention weight.", "Reveal: Add the weighted information to form an attention update."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Attention is one part of a block", "kind": "block", "lines": ["Attention mixes information across available positions.", "A feedforward network transforms each position.", "A residual path keeps the previous representation and adds an update."], "minutes": 2, "notes": "Replace the former unit-like Attn and MLP circles with rectangular processing modules. Show H as a group of four token-vector strips, with the same positions at the input and output. Arrows in this diagram carry the whole sequence of representations, not a single scalar. Build attention first, then a bank of four independent MLP applications, then residual paths and the output to the next block. The four small MLP boxes depict applications of the same feedforward parameters at different positions; they are not four independently trained MLPs. Residual plus circles are elementwise vector additions across the sequence. Both attention and feedforward updates are added to the representation entering their own sublayer. Explain feedforward parameters are shared across positions but no token mixing occurs inside that sublayer. This diagram shows the shared attention, token-wise feedforward and residual structure. The context example uses full attention. Normalization placement differs across architectures; the separate GPT-2 formula reference specifies its pre-normalization order. Repeat blocks to form depth; finish with a vocabulary prediction head. Optional equations make the order precise. Keep normalization in presenter notes: layer normalization rescales components within each token representation and has learned scale and offset parameters. It is omitted from the visible simplified diagram. Focus the main explanation on the residual addition that is actually shown.", "q": "", "a": "", "controls": "", "source": "Vaswani et al. (2017); Radford et al. (2019)", "figure": "", "cfg": {}, "appendix": false, "index": 41, "id": "slide-42", "start": 73.5, "end": 75.5, "part": "Transformers & attention", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Attention mixes information across available positions.", "Reveal: A feedforward network transforms each position.", "Reveal: A residual path keeps the previous representation and adds an update."], "references": [["Vaswani et al. (2017) · Attention Is All You Need", "https://arxiv.org/abs/1706.03762"], ["Radford et al. (2019) · GPT-2", "https://cdn.openai.com/better-language-models/language-models.pdf"]], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Several heads, several learned mixtures", "kind": "heads", "lines": ["Different heads can use different attention patterns.", "Their outputs are combined.", "Head roles are learned rather than assigned in advance."], "minutes": 0.5, "notes": "Two teaching mixtures over the same tokens illustrate distinct weights, not measured GPT head behavior. Do not label one head syntax and another semantics as an empirical fact. Attention weights alone are not a causal explanation of model behavior. The selected query is the token “it”; this example uses all four context tokens, consistent with the full-attention introduction. Each bar is an attention weight for the token directly above it; each head’s weights sum to 1. Blue and orange distinguish heads consistently. The final build shows one output vector for each head, joins those outputs, and applies a learned output projection to produce one attention update. The vector-strip components are schematic and are not computed from the displayed weight rows; each real head also has its own value projection. The output projection can mix and rescale components; it is not simply an average of the head outputs. Both heads attend to the same available tokens but use different learned projections. The two colored rows are separate heads, not different time steps.", "q": "", "a": "", "controls": "", "source": "", "figure": "", "cfg": {}, "appendix": false, "index": 42, "id": "slide-43", "start": 75.5, "end": 76.0, "part": "Transformers & attention", "line_steps": [1, 2, 3], "content_steps": 3, "steps": 3, "cue": ["Introduce the visible input or diagram.", "Reveal: Different heads can use different attention patterns.", "Reveal: Their outputs are combined.", "Reveal: Head roles are learned rather than assigned in advance."], "references": [], "visual_note": "Deterministic teaching illustration. Hand-set parameters are not trained model results. No sampling uncertainty is estimated."}, {"title": "Transformer demos", "kind": "figure", "l
